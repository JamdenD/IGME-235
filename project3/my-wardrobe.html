<body>
    <header>
        <h1>My Wardrobe</h1>
    </header>
    <div id="container">
        <div id="wardrobe">
            <h2>Wardrobe</h2>
            <div class="section">
                <button class="dropdown">Tops</button>
                <div class="content" id="tops">

                </div>
            </div>

            <div class="section">
                <button class="dropdown">Bottoms</button>
                <div class="content" id="bottoms">

                </div>
            </div>

            <div class="section">
                <button class="dropdown">Shoes</button>
                <div class="content" id="shoes">
                    
                </div>
            </div>

            <div class="section">
                <button class="dropdown">Accessories</button>
                <div class="content" id="accessories">
                    
                </div>
            </div>
            <button id="clearWardrobe">Clear Wardrobe</button>
        </div>
	    <div id="room">
            <button id="add">+</button>

            <div id="popup" class="popup hidden">
                <div class="popup-content">
                    <h2>Create New Item</h2>
                        <select id="itemType">
                            <option value="tops">Tops</option>
                            <option value="bottoms">Bottoms</option>
                            <option value="shoes">Shoes</option>
                            <option value="accessories">Accessories</option>
                        </select>

                        <select id="subItem"></select>
                        
                        <input type="color" id="colorPicker">

                        <div class="popup-buttons">
                            <button id="closeButton">Close</button>
                            <button id="submitButton">Submit</button>
                        </div>
                </div>
            </div>

            <div id="character">
                <img src="images/character.png" alt="Character image">
        	</div>
        </div>
